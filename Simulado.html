<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Simulados Pro</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--text);
        }

        header span {
            color: var(--accent);
        }

        .card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 16px;
            color: var(--accent);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Estrutura Responsiva do Assunto */
        .subject-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .subject-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .subj-name {
            flex: 1;
        }

        .subj-qty {
            width: 80px !important;
            text-align: center;
        }

        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Ajuste para telas maiores (Desktop) */
        @media (min-width: 600px) {
            .subject-row {
                flex-direction: row;
                background: transparent;
                padding: 0;
                border: none;
                align-items: center;
            }

            .subject-inputs {
                flex: 1;
            }

            body {
                padding: 24px;
            }
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        /* Dashboard de Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 600px) {
            .metrics-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
            }
        }

        .metric-card {
            background: var(--bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .metric-card .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .metric-card .value {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Tracker */
        .tracker-subject {
            background: var(--bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .questions-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .q-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .q-btn.hit {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .q-btn.miss {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        /* Filtros e Histórico */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 600px) {
            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulados<span>Pro</span></h1>
    </header>

    <section id="config-section" class="card">
        <h2> Criar Novo Simulado</h2>
        
        <div class="form-group">
            <label for="discipline-input">Disciplina</label>
            <input type="text" id="discipline-input" placeholder="Ex: Língua Portuguesa, Direito Constitucional">
        </div>

        <label>Assuntos e Quantidade de Questões</label>
        <div id="subject-rows-container" style="margin-top: 8px;"></div>

        <button class="btn btn-secondary" onclick="addSubjectRow()" style="margin-bottom: 16px; width: 100%;">+ Adicionar Assunto</button>

        <button class="btn" style="width: 100%;" onclick="startQuiz()">Iniciar Simulado</button>
    </section>

    <section id="dashboard-section" class="card hidden">
        <h2> Desempenho do Simulado</h2>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="title">Progresso</div>
                <div class="value" id="stat-progress">0 / 0</div>
            </div>
            <div class="metric-card">
                <div class="title">Acertos</div>
                <div class="value" id="stat-hits" style="color: var(--success);">0</div>
            </div>
            <div class="metric-card">
                <div class="title">Erros</div>
                <div class="value" id="stat-misses" style="color: var(--danger);">0</div>
            </div>
            <div class="metric-card">
                <div class="title">Aproveitamento</div>
                <div class="value" id="stat-percentage" style="color: var(--accent);">0%</div>
            </div>
        </div>
    </section>

    <section id="tracker-section" class="card hidden">
        <h2> Questões</h2>
        <p style="margin-bottom: 16px; color: var(--text-muted); font-size: 0.85rem;">
            Clique nos botões para alternar o status: <strong>Pendente &rarr; Acerto &rarr; Erro</strong>
        </p>

        <div id="tracker-list"></div>

        <button class="btn" style="margin-top: 16px; width: 100%;" onclick="finishQuiz()">Finalizar e Salvar Simulado</button>
    </section>

    <section class="card">
        <h2> Histórico e Filtros</h2>
        
        <div class="filter-grid">
            <div class="form-group" style="margin: 0;">
                <label for="filter-discipline">Filtrar por Disciplina</label>
                <input type="text" id="filter-discipline" placeholder="Todas as disciplinas" oninput="applyFilters()">
            </div>
            <div class="form-group" style="margin: 0;">
                <label for="filter-date">Filtrar por Data</label>
                <input type="date" id="filter-date" onchange="applyFilters()">
            </div>
        </div>

        <div class="metrics-grid" style="margin-bottom: 16px;">
            <div class="metric-card">
                <div class="title">Simulados</div>
                <div class="value" id="hist-total-quizzes">0</div>
            </div>
            <div class="metric-card">
                <div class="title">Questões</div>
                <div class="value" id="hist-total-questions">0</div>
            </div>
            <div class="metric-card">
                <div class="title">Acertos</div>
                <div class="value" id="hist-total-hits" style="color: var(--success);">0</div>
            </div>
            <div class="metric-card">
                <div class="title">Erros</div>
                <div class="value" id="hist-total-misses" style="color: var(--danger);">0</div>
            </div>
        </div>

        <div id="history-container" class="history-list"></div>

        <button class="btn btn-danger" style="margin-top: 16px; width: 100%;" onclick="clearHistory()">Limpar Histórico</button>
    </section>
</div>

<script>
    let activeQuiz = {
        discipline: '',
        subjects: {}
    };

    function init() {
        document.getElementById('subject-rows-container').innerHTML = '';
        addSubjectRow();
        applyFilters();
    }

    function addSubjectRow() {
        const container = document.getElementById('subject-rows-container');
        const row = document.createElement('div');
        row.className = 'subject-row';
        row.innerHTML = `
            <input type="text" class="subj-name" placeholder="Nome do Assunto (Ex: Crase)">
            <div class="subject-inputs">
                <input type="number" class="subj-qty" min="1" value="1" placeholder="Qtd">
                <button class="btn-remove" onclick="this.closest('.subject-row').remove()">&times;</button>
            </div>
        `;
        container.appendChild(row);
    }

    function startQuiz() {
        const discipline = document.getElementById('discipline-input').value.trim();
        const names = document.querySelectorAll('.subj-name');
        const qtys = document.querySelectorAll('.subj-qty');

        if (!discipline) {
            alert('Informe a disciplina antes de iniciar.');
            return;
        }

        activeQuiz = { discipline: discipline, subjects: {} };
        let totalQuestions = 0;

        names.forEach((input, i) => {
            const name = input.value.trim();
            const qty = parseInt(qtys[i].value) || 0;

            if (name && qty > 0) {
                activeQuiz.subjects[name] = Array(qty).fill('neutral');
                totalQuestions += qty;
            }
        });

        if (totalQuestions === 0) {
            alert('Adicione pelo menos um assunto válido.');
            return;
        }

        document.getElementById('config-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('tracker-section').classList.remove('hidden');

        renderTracker();
        updateDashboard();
    }

    function renderTracker() {
        const container = document.getElementById('tracker-list');
        container.innerHTML = '';

        for (const [subject, statusArray] of Object.entries(activeQuiz.subjects)) {
            let buttonsHTML = '';
            let hits = 0;

            statusArray.forEach((status, i) => {
                if (status === 'hit') hits++;
                buttonsHTML += `
                    <button class="q-btn ${status}" onclick="toggleQuestion('${subject}', ${i})">
                        ${i + 1}
                    </button>
                `;
            });

            container.innerHTML += `
                <div class="tracker-subject">
                    <div class="tracker-header">
                        <span>${subject}</span>
                        <span>${hits} / ${statusArray.length} acertos</span>
                    </div>
                    <div class="questions-grid">${buttonsHTML}</div>
                </div>
            `;
        }
    }

    function toggleQuestion(subject, index) {
        const current = activeQuiz.subjects[subject][index];
        if (current === 'neutral') activeQuiz.subjects[subject][index] = 'hit';
        else if (current === 'hit') activeQuiz.subjects[subject][index] = 'miss';
        else activeQuiz.subjects[subject][index] = 'neutral';

        renderTracker();
        updateDashboard();
    }

    function updateDashboard() {
        let total = 0, answered = 0, hits = 0, misses = 0;

        for (const statusArray of Object.values(activeQuiz.subjects)) {
            statusArray.forEach(status => {
                total++;
                if (status !== 'neutral') answered++;
                if (status === 'hit') hits++;
                if (status === 'miss') misses++;
            });
        }

        const percentage = answered > 0 ? ((hits / answered) * 100).toFixed(1) : 0;

        document.getElementById('stat-progress').innerText = `${answered} / ${total}`;
        document.getElementById('stat-hits').innerText = hits;
        document.getElementById('stat-misses').innerText = misses;
        document.getElementById('stat-percentage').innerText = `${percentage}%`;
    }

    function finishQuiz() {
        let total = 0, hits = 0, misses = 0;

        for (const statusArray of Object.values(activeQuiz.subjects)) {
            statusArray.forEach(status => {
                total++;
                if (status === 'hit') hits++;
                if (status === 'miss') misses++;
            });
        }

        const now = new Date();
        const quizRecord = {
            id: Date.now(),
            discipline: activeQuiz.discipline,
            subjects: activeQuiz.subjects,
            dateISO: now.toISOString().split('T')[0],
            dateFormatted: now.toLocaleDateString('pt-BR') + ' às ' + now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
            total,
            hits,
            misses,
            percentage: total > 0 ? ((hits / total) * 100).toFixed(1) : 0
        };

        const history = JSON.parse(localStorage.getItem('pro_quiz_history') || '[]');
        history.unshift(quizRecord);
        localStorage.setItem('pro_quiz_history', JSON.stringify(history));

        document.getElementById('config-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('tracker-section').classList.add('hidden');
        document.getElementById('discipline-input').value = '';
        
        init();
        alert('Simulado finalizado e gravado com sucesso!');
    }

    function applyFilters() {
        const discFilter = document.getElementById('filter-discipline').value.toLowerCase().trim();
        const dateFilter = document.getElementById('filter-date').value;

        const history = JSON.parse(localStorage.getItem('pro_quiz_history') || '[]');

        const filtered = history.filter(item => {
            const matchDisc = item.discipline.toLowerCase().includes(discFilter);
            const matchDate = dateFilter ? item.dateISO === dateFilter : true;
            return matchDisc && matchDate;
        });

        renderFilteredMetrics(filtered);
        renderHistoryList(filtered);
    }

    function renderFilteredMetrics(data) {
        let totalQuizzes = data.length;
        let totalQuestions = 0;
        let totalHits = 0;
        let totalMisses = 0;

        data.forEach(item => {
            totalQuestions += item.total;
            totalHits += item.hits;
            totalMisses += item.misses;
        });

        document.getElementById('hist-total-quizzes').innerText = totalQuizzes;
        document.getElementById('hist-total-questions').innerText = totalQuestions;
        document.getElementById('hist-total-hits').innerText = totalHits;
        document.getElementById('hist-total-misses').innerText = totalMisses;
    }

    function renderHistoryList(data) {
        const container = document.getElementById('history-container');

        if (data.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 12px;">Nenhum simulado encontrado.</p>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="history-card">
                <div class="history-header">
                    <div>
                        <strong>${item.discipline}</strong>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">${item.dateFormatted}</div>
                    </div>
                    <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent);">
                        ${item.percentage}%
                    </div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                    Questões: ${item.total} | Acertos: <span style="color:var(--success)">${item.hits}</span> | Erros: <span style="color:var(--danger)">${item.misses}</span>
                </div>
            </div>
        `).join('');
    }

    function clearHistory() {
        if (confirm('Tem certeza que deseja apagar todo o histórico?')) {
            localStorage.removeItem('pro_quiz_history');
            applyFilters();
        }
    }

    init();
</script>
</body>
</html>
