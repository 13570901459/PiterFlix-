<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Estudos & Edital Verticalizado</title>
  
  <!-- CSS Base Dark Mode Moderno -->
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Modais e Autenticação */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      margin-bottom: 20px;
      text-align: center;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .toggle-auth {
      margin-top: 15px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Layout Principal */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      padding: 8px 16px;
      border-radius: 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
    }

    .nav-btn.active {
      background-color: var(--border-color);
      color: var(--accent);
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    .grid-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
    }

    .card h3 {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    /* Lousa Flutuante */
    #lousa-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      pointer-events: none;
    }

    #lousa-canvas {
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .lousa-tools {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    /* Ocultar Seções */
    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .doc-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #2563eb;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-card">
      <h2 id="auth-title">Acessar Plataforma</h2>
      <form id="auth-form">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="auth-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="auth-password" required placeholder="******">
        </div>
        <button type="submit" class="btn" id="auth-btn-submit">Entrar</button>
      </form>
      <div class="toggle-auth" id="toggle-auth">
        Não tem uma conta? Criar conta
      </div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app">
    <header>
      <h2>Estudos & Edital</h2>
      <nav>
        <button class="nav-btn active" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="nav-btn" onclick="switchTab('edital')">Edital</button>
        <button class="nav-btn" onclick="switchTab('revisoes')">Revisões</button>
        <button class="nav-btn" onclick="toggleLousa()">Lousa</button>
        <button class="nav-btn" onclick="handleLogout()">Sair</button>
      </nav>
    </header>

    <main>
      <!-- DASHBOARD -->
      <section id="sec-dashboard" class="section active">
        <h2>Painel de Desempenho Hoje</h2>
        <div class="grid-dashboard">
          <div class="card">
            <h3>Questões Feitas</h3>
            <div class="value" id="dash-hoje-total">0</div>
          </div>
          <div class="card">
            <h3>Acertos</h3>
            <div class="value" style="color: var(--success);" id="dash-hoje-acertos">0</div>
          </div>
          <div class="card">
            <h3>Erros</h3>
            <div class="value" style="color: var(--danger);" id="dash-hoje-erros">0</div>
          </div>
        </div>

        <h2>Desempenho Geral</h2>
        <div class="grid-dashboard">
          <div class="card">
            <h3>Total de Questões</h3>
            <div class="value" id="dash-geral-total">0</div>
          </div>
          <div class="card">
            <h3>Acertos Gerais</h3>
            <div class="value" style="color: var(--success);" id="dash-geral-acertos">0</div>
          </div>
          <div class="card">
            <h3>Aproveitamento Geral</h3>
            <div class="value" style="color: var(--accent);" id="dash-geral-aproveitamento">0%</div>
          </div>
        </div>
      </section>

      <!-- EDITAL VERTICALIZADO -->
      <section id="sec-edital" class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Edital Verticalizado</h2>
          <button class="btn" style="width: auto;" onclick="openAddDisciplinaModal()">+ Nova Disciplina</button>
        </div>
        <div id="disciplinas-list"></div>
      </section>

      <!-- REVISÕES -->
      <section id="sec-revisoes" class="section">
        <h2>Revisões do Dia</h2>
        <div id="revisoes-list" style="margin-top: 15px;">
          <p style="color: var(--text-muted);">Nenhuma revisão agendada para hoje.</p>
        </div>
      </section>
    </main>

    <!-- LOUSA FLUTUANTE -->
    <div id="lousa-container">
      <canvas id="lousa-canvas"></canvas>
      <div class="lousa-tools">
        <input type="color" id="lousa-color" value="#38bdf8">
        <button class="btn btn-secondary" onclick="clearLousa()">Limpar</button>
        <button class="btn" onclick="toggleLousa()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE E LÓGICA DA APLICAÇÃO -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ ATENÇÃO: Substitua os dados abaixo com as credenciais do seu projeto Firebase Console
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isSignUp = false;

    // Gerenciamento de Autenticação
    const authForm = document.getElementById("auth-form");
    const toggleAuth = document.getElementById("toggle-auth");
    const authTitle = document.getElementById("auth-title");
    const authBtnSubmit = document.getElementById("auth-btn-submit");

    toggleAuth.addEventListener("click", () => {
      isSignUp = !isSignUp;
      authTitle.innerText = isSignUp ? "Criar Conta" : "Acessar Plataforma";
      authBtnSubmit.innerText = isSignUp ? "Cadastrar" : "Entrar";
      toggleAuth.innerText = isSignUp ? "Já tem uma conta? Entrar" : "Não tem uma conta? Criar conta";
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("Conta criada com sucesso!");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("Erro na autenticação: " + error.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        loadUserData();
      } else {
        currentUser = null;
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app").style.display = "none";
      }
    });

    window.handleLogout = () => signOut(auth);

    // Navegação por Abas
    window.switchTab = (tabName) => {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      
      document.getElementById(`sec-${tabName}`).classList.add("active");
      event.target.classList.add("active");
    };

    // Lógica da Lousa Flutuante
    let isDrawing = false;
    const canvas = document.getElementById("lousa-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    window.toggleLousa = () => {
      const container = document.getElementById("lousa-container");
      const isVisible = container.style.display === "block";
      container.style.display = isVisible ? "none" : "block";
    };

    canvas.addEventListener("mousedown", () => isDrawing = true);
    canvas.addEventListener("mouseup", () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener("mousemove", draw);

    function draw(e) {
      if (!isDrawing) return;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.strokeStyle = document.getElementById("lousa-color").value;

      ctx.lineTo(e.clientX, e.clientY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.clientX, e.clientY);
    }

    window.clearLousa = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Carregar Dados do Usuário
    function loadUserData() {
      if (!currentUser) return;
      // Ouvinte em tempo real no Firestore
      onSnapshot(doc(db, "users", currentUser.uid), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          // Atualizar indicadores e interface
        }
      });
    }
  </script>
</body>
</html>
