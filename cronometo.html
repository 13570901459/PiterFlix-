### 1. TELA INICIAL (DASHBOARD PRINCIPAL)
Ao realizar o login, a tela de abertura imediata deve ser o Dashboard contendo:
- **Painel Geral (Acumulado Histórico):**
  - Total de questões respondidas no geral.
  - Total de acertos e total de erros.
  - % de Aproveitamento de Acertos e % de Erros com indicadores visuais/barras gráficas.
- **Painel do Dia (00:00 às 23:59):**
  - Contagem iniciada às 00:00 e finalizada às 23:59 do dia corrente.
  - Total de questões feitas no dia, acertos do dia, erros do dia e % de aproveitamento diário.
  - **Relatório de Encerramento Diário:** Botão "Encerrar Estudo do Dia" que gera um resumo/popup detalhando: total de questões feitas no dia e o detalhamento de questões respondidas separadas por cada disciplina.
- **Painel do Edital Verticalizado (Visão Rápida):**
  - Barras de progresso dinâmicas indicando a cobertura do edital por disciplina (ex: Português 20%, Direito 80%).

---

### 2. MENU HAMBÚRGUER (NAVEGAÇÃO LATERAL ESQUERDA)
O menu retrátil da esquerda deve conter o acesso para as seguintes seções:
1. **Dashboard** (Tela Principal)
2. **Cronômetro de Estudo (Horas Líquidas):**
   - Seleção da disciplina antes de iniciar o contador.
   - Botões de Iniciar, Pausar e Salvar Sessão.
   - Registro permanente salvando o tempo acumulado de estudo diário e semanal por disciplina no Firestore (ex: Português: 3h 20min, Matemática: 1h 45min).
3. **Disciplinas & Conteúdos**
4. **Edital Verticalizado Completo & Check-in**
5. **Cronograma do Dia / Revisões Espaçadas**
6. **Filtro Avançado de Questões:**
   - Filtro por Disciplina, por Assunto e por Status (Todas, Acertadas, Erradas, Não Respondidas).

---

### 3. ESTRUTURA DE DISCIPLINAS, ASSUNTOS E LOTES DE QUESTÕES
- **Nível 1 - Disciplina:** Acessar a aba "Disciplinas", cadastrar, editar ou excluir disciplinas.
- **Nível 2 - Assunto:** Ao entrar em uma disciplina, cadastrar/editar assuntos. Para cada assunto, permitir vincular o **Link do Resumo no Google Docs** (abrir em nova aba).
- **Nível 3 - Lotes de Questões (Formato JSON):**
  - Cada assunto pode ter múltiplos lotes (baterias de 10, 20, 30, 40 ou mais questões).
  - Modal/Área para importar questões colando o JSON no formato:

  {
    "disciplina": "Língua Portuguesa",
    "tema": "Concordância Verbal e Nominal",
    "questoes": [
      {
        "id": 1,
        "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão...",
        "alternativas": {
          "A": "Haviam muitos candidatos...",
          "B": "Faziam anos...",
          "C": "Existe várias...",
          "D": "A maioria dos inscritos compareceu..."
        },
        "resposta_correta": "D",
        "comentario": "Com expressão partitiva..."
      }
    ]
  }

- **Opções de Execução de Questões:**
  - **Lote Específico:** Escolher e responder apenas um lote selecionado.
  - **Lote Geral:** Compilar e responder todas as questões do assunto.
  - **Controle de Progresso:** Opções de **"Continuar Onde Parei"** (salva a última questão respondida no Firestore) ou **"Reiniciar do Zero"**.

---

### 4. MÓDULO DE RESOLUÇÃO & LOUSA FLUTUANTE FIXA (CANVAS OVERLAY)
- **Barra Flutuante de Rabisco/Lousa:**
  - Ferramenta de anotação com canvas transparente fixa sobre a tela.
  - **Comportamento de Rolagem:** Ao rolar a página para ler o enunciado ou avançar as questões, a marcação do rabisco **permanece fixa** sem sumir ou desalinhada.
  - Ferramentas: Lápis para rabiscar/rascunho, borracha para apagar seleções específicas e botão "Limpar Tudo".
- **Painel da Questão:**
  - Contador dinâmico de acertos e erros em tempo real.
  - Seleção de alternativa, botão para confirmar, feedback imediato de acerto/erro e exibição do gabarito comentado.

---

### REQUISITOS TÉCNICOS E DESIGN
1. **Design System:** Interface moderna, limpa, totalmente responsiva (mobile-first) em Tema Escuro (Dark Mode) usando Tailwind CSS via CDN.
2. **Estrutura:** Código contido integralmente em 1 arquivo `.html`.
3. **Persistência no Firebase:** Sincronização em tempo real de todas as questões, cadastros, cronômetro de horas líquidas e histórico sob a árvore `users/{uid}/...` no Firestore.
