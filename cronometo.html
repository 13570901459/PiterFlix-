<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QG Estudo - Plataforma de Estudos</title>
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: rgba(23, 32, 54, 0.7);
            --bg-card-solid: #172036;
            --bg-input: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(59, 130, 246, 0.4);
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- OVERLAY DE AUTENTICAÇÃO (LOGIN/CADASTRO) --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main);
            background-image: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.25), transparent 70%);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
        }

        .auth-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .auth-logo span { color: var(--accent); }
        .auth-subtitle { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 25px; }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .google-btn:hover { background: #f1f5f9; transform: translateY(-1px); }

        .divider {
            display: flex;
            align-items: center;
            color: var(--text-sub);
            font-size: 0.75rem;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .divider span { padding: 0 10px; }

        .auth-links {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .auth-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-links a:hover { text-decoration: underline; }

        /* --- CABEÇALHO --- */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.85rem;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-title span { color: var(--accent); }

        /* --- ESTRUTURA DE COMPONENTES DA PLATAFORMA --- */
        .container {
            padding: 20px; max-width: 1100px;
            margin: 0 auto; width: 100%; flex: 1;
        }

        .grid-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); border-color: var(--border-hover); }
        .stat-card h5 { color: var(--text-sub); font-size: 0.75rem; margin-bottom: 6px; }
        .stat-card .num { font-size: 1.6rem; font-weight: 800; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }

        .form-control {
            width: 100%; padding: 12px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-main); font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .btn {
            width: 100%;
            padding: 12px 18px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem;
        }

        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 14px var(--accent-glow); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }

        .hidden { display: none !important; }

        .timer-box {
            text-align: center; padding: 15px; background: var(--bg-input);
            border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border);
        }

        .timer-display { font-size: 2.2rem; font-family: monospace; font-weight: bold; color: var(--warning); }
    </style>

    <!-- FIREBASE SDK v10 (MODULAR) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail,
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            onSnapshot 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Configuração do Firebase do projeto qgestudo
        const firebaseConfig = {
            apiKey: "AIzaSyCUpkn3zhkdt3nCEaURN8GzaBbtimpQKOE",
            authDomain: "qgestudo.firebaseapp.com",
            projectId: "qgestudo",
            storageBucket: "qgestudo.firebasestorage.app",
            messagingSenderId: "939034677008",
            appId: "1:939034677008:web:348adbf8cd89b3ed145f95",
            measurementId: "G-PC8ESJHFZ5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeSnapshot = null;

        // --- SISTEMA DE AUTENTICAÇÃO ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-platform').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('user-avatar-initial').innerText = (user.displayName || user.email)[0].toUpperCase();
                bindFirestoreData(user.uid);
            } else {
                currentUser = null;
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                document.getElementById('main-platform').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.loginEmail = async function() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert('Preencha e-mail e senha.');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert('Erro ao entrar: ' + getAuthErrorMessage(err.code));
            }
        };

        window.registerEmail = async function() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert('Informe e-mail e senha.');
            if (password.length < 6) return alert('A senha precisa ter no mínimo 6 caracteres.');

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('Conta criada com sucesso!');
            } catch (err) {
                alert('Erro ao cadastrar: ' + getAuthErrorMessage(err.code));
            }
        };

        window.forgotPassword = async function() {
            const email = document.getElementById('auth-email').value.trim();
            if (!email) return alert('Digite seu e-mail para receber o link de recuperação.');

            try {
                await sendPasswordResetEmail(auth, email);
                alert('E-mail de redefinição enviado com sucesso!');
            } catch (err) {
                alert('Erro: ' + getAuthErrorMessage(err.code));
            }
        };

        window.loginGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert('Erro no login com Google: ' + err.message);
            }
        };

        window.logout = function() {
            signOut(auth);
        };

        // --- FIRESTORE REAL-TIME SYNC ---
        function bindFirestoreData(uid) {
            const userDocRef = doc(db, "usuarios", uid, "dados", "plataforma");

            unsubscribeSnapshot = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('stat-questoes').innerText = data.questoes || 0;
                    document.getElementById('stat-horas').innerText = (data.minutosEstudados ? (data.minutosEstudados / 60).toFixed(1) : '0.0') + 'h';
                }
            });
        }

        window.toggleAuthMode = function(mode) {
            const title = document.getElementById('auth-card-title');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const toggleText = document.getElementById('toggle-auth-text');

            if (mode === 'register') {
                title.innerText = 'Criar sua conta';
                btnLogin.classList.add('hidden');
                btnRegister.classList.remove('hidden');
                toggleText.innerHTML = 'Já tem uma conta? <a href="#" onclick="toggleAuthMode(\'login\')">Entrar</a>';
            } else {
                title.innerText = 'Acessar Plataforma';
                btnLogin.classList.remove('hidden');
                btnRegister.classList.add('hidden');
                toggleText.innerHTML = 'Não tem conta? <a href="#" onclick="toggleAuthMode(\'register\')">Cadastre-se</a>';
            }
        };

        function getAuthErrorMessage(code) {
            switch(code) {
                case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
                case 'auth/email-already-in-use': return 'Este e-mail já está em uso.';
                case 'auth/user-not-found': return 'Usuário não encontrado.';
                case 'auth/wrong-password': return 'Senha incorreta.';
                default: return code;
            }
        }
    </script>
</head>
<body>

    <!-- OVERLAY DE AUTENTICAÇÃO -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">QG <span>Estudo</span></div>
            <div class="auth-subtitle" id="auth-card-title">Acessar Plataforma</div>

            <button class="google-btn" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.32 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.68 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.69 6.72-4.69z"/></svg>
                Entrar com o Google
            </button>

            <div class="divider"><span>OU</span></div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="auth-email" class="form-control" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
            </div>

            <button id="btn-login" class="btn btn-primary" onclick="loginEmail()">Entrar</button>
            <button id="btn-register" class="btn btn-primary hidden" onclick="registerEmail()">Cadastrar Conta</button>

            <div class="auth-links">
                <p><a href="#" onclick="forgotPassword()">Esqueceu sua senha?</a></p>
                <br>
                <p id="toggle-auth-text">Não tem conta? <a href="#" onclick="toggleAuthMode('register')">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <!-- ÁREA DA PLATAFORMA DE ESTUDOS (PROTEGIDA) -->
    <div id="main-platform" class="hidden">
        <header>
            <div class="header-title">QG <span>Estudo</span></div>
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar-initial">U</div>
                <span id="user-email-display" style="font-size: 0.85rem; color: var(--text-sub);">usuario@email.com</span>
                <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.75rem; margin-left: 10px;" onclick="logout()">Sair</button>
            </div>
        </header>

        <div class="container">
            <div class="grid-stats">
                <div class="stat-card">
                    <h5>QUESTÕES</h5>
                    <div class="num text-accent" id="stat-questoes">0</div>
                </div>
                <div class="stat-card">
                    <h5>TEMPO TOTAL</h5>
                    <div class="num text-warning" id="stat-horas">0.0h</div>
                </div>
            </div>

            <div class="card">
                <h3>Cronômetro de Estudo</h3>
                <br>
                <div class="timer-box">
                    <div class="timer-display">00:00:00</div>
                </div>
                <button class="btn btn-primary">Iniciar Sessão de Estudo</button>
            </div>
        </div>
    </div>

</body>
</html>
