<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QG Estudo - Plataforma Profissional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- SDKs do Firebase v10 (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas chaves reais do projeto qgestudo
    const firebaseConfig = {
      apiKey: "AIzaSyCUpkn3zhkdt3nCEaURN8GzaBbtimpQKOE",
      authDomain: "qgestudo.firebaseapp.com",
      projectId: "qgestudo",
      storageBucket: "qgestudo.firebasestorage.app",
      messagingSenderId: "939034677008",
      appId: "1:939034677008:web:348adbf8cd89b3ed145f95",
      measurementId: "G-PC8ESJHFZ5"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.auth = auth;
    window.db = db;
    window.firebaseServices = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      doc,
      setDoc,
      onSnapshot
    };
  </script>
  
  <style>
    .sidebar-transition { transition: transform 0.3s ease-in-out; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Tela de Auth (Login / Cadastro) -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <div class="flex flex-col items-center mb-6">
        <div class="p-3 bg-blue-600/10 rounded-xl border border-blue-500/20 text-blue-400 mb-3">
          <i data-lucide="graduation-cap" class="w-8 h-8"></i>
        </div>
        <h2 id="auth-title" class="text-2xl font-bold text-white">QG Estudo</h2>
        <p class="text-xs text-slate-400 mt-1">Acesse seu histórico e progresso na nuvem</p>
      </div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">E-mail</label>
          <input type="email" id="auth-email" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Senha</label>
          <input type="password" id="auth-password" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
        </div>
        <button type="submit" id="auth-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition text-sm flex items-center justify-center gap-2">
          <span>Entrar no Painel</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-4 text-center">
        <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-xs text-blue-400 hover:underline">
          Não tem conta? Cadastre-se gratuitamente
        </button>
      </div>
    </div>
  </div>

  <!-- Layout Principal -->
  <div id="app-screen" class="hidden flex-1 flex overflow-hidden">
    
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-950 border-r border-slate-800 transform -translate-x-full md:translate-x-0 sidebar-transition flex flex-col">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="graduation-cap" class="w-6 h-6 text-blue-400"></i>
          <span class="font-bold text-slate-100 text-lg">QG Estudo</span>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
        <button onclick="navigate('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue-400"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="navigate('edital')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <i data-lucide="list-checks" class="w-4 h-4 text-emerald-400"></i>
          <span>Edital Verticalizado</span>
        </button>
      </nav>

      <div class="p-4 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/30 flex items-center justify-center font-bold text-blue-400 text-xs" id="user-avatar">US</div>
          <div class="text-xs">
            <p class="font-semibold text-white truncate max-w-[110px]" id="user-email-display">usuario@email.com</p>
            <p class="text-slate-400 text-[10px]">QG Sincronizado</p>
          </div>
        </div>
        <button onclick="logoutFirebase()" class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg transition" title="Sair">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <main class="flex-1 md:ml-64 flex flex-col min-h-screen bg-slate-900 overflow-y-auto custom-scrollbar">
      
      <header class="h-16 border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-20 px-4 md:px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg border border-slate-800">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h1 id="page-title" class="text-lg font-bold text-white">Dashboard Geral</h1>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Conectado ao Firebase
        </span>
      </header>

      <div class="p-4 md:p-6 space-y-6 max-w-7xl w-full mx-auto">
        
        <section id="page-dashboard" class="space-y-6">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4">
              <p class="text-xs font-semibold text-slate-400 uppercase">Total Resolvido</p>
              <h3 id="dash-total-questoes" class="text-2xl font-black text-white mt-1">0</h3>
            </div>
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4">
              <p class="text-xs font-semibold text-emerald-400 uppercase">Taxa de Acertos</p>
              <h3 id="dash-pct-acerto" class="text-2xl font-black text-emerald-400 mt-1">0%</h3>
            </div>
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4">
              <p class="text-xs font-semibold text-rose-400 uppercase">Margem de Erro</p>
              <h3 id="dash-pct-erro" class="text-2xl font-black text-rose-400 mt-1">0%</h3>
            </div>
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4">
              <p class="text-xs font-semibold text-purple-400 uppercase">Horas Líquidas</p>
              <h3 id="dash-horas" class="text-2xl font-black text-purple-400 mt-1">0h</h3>
            </div>
          </div>
        </section>

        <section id="page-edital" class="hidden space-y-6">
          <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
              <h2 class="text-lg font-bold text-white">Edital Verticalizado</h2>
              <button onclick="addDisciplinaCloud()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold">
                + Nova Disciplina
              </button>
            </div>
            <div id="edital-container" class="space-y-4"></div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script>
    let isLoginMode = true;
    let userState = { disciplinas: [] };
    let currentUserUid = null;

    window.addEventListener('load', () => {
      lucide.createIcons();
      setTimeout(() => {
        if (!window.auth) return;
        
        window.firebaseServices.onAuthStateChanged(window.auth, (user) => {
          if (user) {
            currentUserUid = user.uid;
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("app-screen").classList.remove("hidden");
            document.getElementById("user-email-display").innerText = user.email;
            syncUserData(user.uid);
          } else {
            currentUserUid = null;
            document.getElementById("auth-screen").classList.remove("hidden");
            document.getElementById("app-screen").classList.add("hidden");
          }
        });
      }, 800);
    });

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById("auth-title").innerText = isLoginMode ? "QG Estudo" : "Criar Conta no QG Estudo";
      document.getElementById("auth-btn").querySelector("span").innerText = isLoginMode ? "Entrar no Painel" : "Cadastrar Conta";
      document.getElementById("toggle-auth-btn").innerText = isLoginMode ? "Não tem conta? Cadastre-se gratuitamente" : "Já tem conta? Faça login";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;

      try {
        if (isLoginMode) {
          await window.firebaseServices.signInWithEmailAndPassword(window.auth, email, pass);
        } else {
          const userCredential = await window.firebaseServices.createUserWithEmailAndPassword(window.auth, email, pass);
          await window.firebaseServices.setDoc(window.firebaseServices.doc(window.db, "users", userCredential.user.uid), {
            disciplinas: [
              { id: 1, nome: "Língua Portuguesa", horas: 10, questoesAcertos: 20, questoesErros: 5 }
            ]
          });
        }
      } catch (error) {
        alert("Erro de Autenticação: " + error.message);
      }
    }

    function logoutFirebase() {
      window.firebaseServices.signOut(window.auth);
    }

    function syncUserData(uid) {
      const userRef = window.firebaseServices.doc(window.db, "users", uid);
      window.firebaseServices.onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          userState = docSnap.data();
          renderDashboard();
          renderEdital();
        }
      });
    }

    async function saveUserData() {
      if (!currentUserUid) return;
      const userRef = window.firebaseServices.doc(window.db, "users", currentUserUid);
      await window.firebaseServices.setDoc(userRef, userState);
    }

    function renderDashboard() {
      let acertos = 0, erros = 0, horas = 0;
      (userState.disciplinas || []).forEach(d => {
        acertos += (d.questoesAcertos || 0);
        erros += (d.questoesErros || 0);
        horas += (d.horas || 0);
      });

      const total = acertos + erros;
      document.getElementById("dash-total-questoes").innerText = total;
      document.getElementById("dash-pct-acerto").innerText = total > 0 ? ((acertos/total)*100).toFixed(1) + "%" : "0%";
      document.getElementById("dash-pct-erro").innerText = total > 0 ? ((erros/total)*100).toFixed(1) + "%" : "0%";
      document.getElementById("dash-horas").innerText = `${horas}h`;
    }

    function renderEdital() {
      const container = document.getElementById("edital-container");
      container.innerHTML = (userState.disciplinas || []).map(d => `
        <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between">
          <div>
            <h4 class="font-bold text-white text-sm">${d.nome}</h4>
            <p class="text-xs text-slate-400">${d.horas || 0}h estudadas • ${d.questoesAcertos || 0} acertos / ${d.questoesErros || 0} erros</p>
          </div>
          <button onclick="simularSimuladoCloud(${d.id})" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded-lg font-medium">
            + Registrar Acerto
          </button>
        </div>
      `).join("");
    }

    async function addDisciplinaCloud() {
      const nome = prompt("Nome da nova disciplina:");
      if (!nome) return;
      if (!userState.disciplinas) userState.disciplinas = [];
      userState.disciplinas.push({
        id: Date.now(),
        nome: nome,
        horas: 0,
        questoesAcertos: 0,
        questoesErros: 0
      });
      await saveUserData();
    }

    async function simularSimuladoCloud(discId) {
      const disc = userState.disciplinas.find(d => d.id === discId);
      if (disc) {
        disc.questoesAcertos = (disc.questoesAcertos || 0) + 1;
        await saveUserData();
      }
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("-translate-x-full");
      document.getElementById("sidebar-overlay").classList.toggle("hidden");
    }

    function navigate(page) {
      document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
      document.getElementById(`page-${page}`).classList.remove("hidden");
    }
  </script>
</body>
</html>
