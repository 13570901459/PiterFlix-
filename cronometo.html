### 1. DASHBOARD PRINCIPAL (TELA INICIAL)
Ao realizar o login, a tela de abertura exibe:
- **Painel Geral (Acumulado Histórico):** Total de questões respondidas, total de acertos, total de erros e gráficos de % de aproveitamento.
- **Painel do Dia (00:00 às 23:59):** Métricas diárias que reiniciam o contador às 00:00.
- **Relatório de Encerramento Diário:** Botão "Encerrar Estudo do Dia" com modal resumindo: total de questões feitas no dia e o detalhamento por disciplina.
- **Progresso do Edital Verticalizado:** Barras gráficas do percentual concluído por disciplina.

---

### 2. MENU HAMBÚRGUER (NAVEGAÇÃO LATERAL)
O menu retrátil da esquerda contém:
1. **Dashboard**
2. **Cronômetro de Estudo (Horas Líquidas):** Seleção de disciplina e salvamento do tempo diário/semanal no Firestore.
3. **Disciplinas & Conteúdos (Com Gestão de Lotes de Questões e Link do Google Docs em cada assunto)**
4. **Edital Verticalizado Completo & Check-in**
5. **Cronograma Semanal de Estudos (NOVO):**
   - Planejador de ciclo de estudos por dias da semana (Segunda a Domingo).
   - O usuário pode configurar os parâmetros para cada dia: selecionar Disciplina, Assunto, meta de Horas Líquidas, número de Questões e se a meta inclui Ler Resumo (Google Docs).
   - Rotina estruturada:
     - **Segunda a Sexta:** Disciplinas, leitura de resumo e resolução de questões (ex: 15, 20, 30 questões).
     - **Sábado:** Marcação dedicada para "Revisão Geral".
     - **Domingo:** Marcação dedicada para "Simulado".
   - Sincronização e salvamento total da rotina semanal no Firestore.
6. **Filtro Avançado de Questões (ATUALIZADO):**
   - Seleção refinada por **Disciplina**, **Assunto** e **Status Exacto da Questão**:
     - *Apenas Questões Acertadas* (para reforço e consolidação)
     - *Apenas Questões Erradas* (para correção de pontos fracos/caderno de erros)
     - *Apenas Questões Em Branco / Não Respondidas* (para avançar no conteúdo inédito)
7. **Quadro de Revisões Espaçadas (SRS)**

---

### 3. ESTRUTURA DE DISCIPLINAS, ASSUNTOS E IMPORTADOR DE QUESTÕES JSON
- **Disciplinas & Assuntos:** Cadastro completo com campo para salvar e abrir a URL do Resumo no Google Docs.
- **Importador JSON de Questões:** Modal para importar baterias/lotes colando a estrutura de JSON:

  {
    "disciplina": "Língua Portuguesa",
    "tema": "Concordância Verbal e Nominal",
    "questoes": [
      {
        "id": 1,
        "enunciado": "Assinale a alternativa em que a concordância verbal está de acordo...",
        "alternativas": {
          "A": "Haviam muitos candidatos...",
          "B": "Faziam anos...",
          "C": "Existe várias...",
          "D": "A maioria dos inscritos compareceu..."
        },
        "resposta_correta": "D",
        "comentario": "Com expressão partitiva..."
      }
    ]
  }

- **Resolução de Lotes:** Opção para executar **Lote Específico** ou **Lote Geral do Assunto**, com botões de **"Continuar Onde Parei"** e **"Reiniciar do Zero"**.

---

### 4. LOUSA FLUTUANTE EXPANDÍVEL E MÓVEL (DRAGGABLE CANVAS OVERLAY)
- **Design Flexível e Flutuante:**
  - Inicialmente exibida como um **ícone/botão flutuante discreto (um lápis/engrenagem)** no canto da tela.
  - Ao clicar no ícone, a lousa se expande em uma janela móvel (com barra superior para **arrastar/mover** para qualquer lugar da tela).
  - Pode ser minimizada a qualquer momento voltando ao ícone de lápis sem perder o que foi desenhado.
- **Funcionalidades da Lousa:**
  - Canvas transparente sobreposto que permite rolagem da página sem desalinhar ou apagar a marcação.
  - Seleção de cores do lápis, ferramenta borracha, controle de espessura e botão "Limpar Tudo".

---

### REQUISITOS TÉCNICOS, ESTÉTICOS E COMERCIAIS
1. **Design System:** Interface comercial ultra-moderna, limpa, totalmente responsiva (mobile-first) em Tema Escuro (Dark Mode) usando Tailwind CSS via CDN.
2. **Estrutura:** Código contido integralmente em 1 único arquivo `.html`.
3. **Persistência no Firebase:** Sincronização imediata de todas as ações no Cloud Firestore sob a árvore do usuário (`users/{uid}/...`).
